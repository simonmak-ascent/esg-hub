name: KM R&D Verification Loop

on:
  schedule:
    - cron: "13 4 * * *" # 04:13 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

concurrency:
  group: km-rd-loop
  cancel-in-progress: false

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rd-loop:
    runs-on: [self-hosted, apg-ci-04]
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The production environment is a repository secret. It used to be pulled
      # from Vercel; that project no longer exists, so the secret is the source
      # of truth. Create it from the node's /etc/esg-hub/<slot>.env.
      - name: Write the production environment
        run: printf '%s' "${{ secrets.PRODUCTION_ENV }}" > .env.production.local

      - name: Run KM R&D verification loop
        env:
          # Not part of the app runtime, so it stays a repo secret.
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: node scripts/km-rd-loop.mjs
