name: KM R&D Verification Loop

on:
  schedule:
    - cron: "13 4 * * *" # 04:13 UTC daily
  workflow_dispatch: {}

concurrency:
  group: km-rd-loop
  cancel-in-progress: false

jobs:
  rd-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run KM R&D verification loop
        run: node scripts/km-rd-loop.mjs
        env:
          SURREAL_URL: ${{ secrets.SURREAL_URL }}
          SURREAL_USERNAME: ${{ secrets.SURREAL_USERNAME }}
          SURREAL_PASSWORD: ${{ secrets.SURREAL_PASSWORD }}
          SURREAL_DATABASE: ${{ secrets.SURREAL_DATABASE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ESG_HUB_WRITE_TOKEN: ${{ secrets.ESG_HUB_WRITE_TOKEN }}
