name: KM R&D Verification Loop

on:
  schedule:
    - cron: "13 4 * * *" # 04:13 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

concurrency:
  group: km-rd-loop
  cancel-in-progress: false

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rd-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The GitHub SURREAL_* secrets are stale (signin returns InvalidAuth);
      # the Vercel production environment has the working credentials.
      - name: Pull Vercel environment
        run: npx --yes vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Load the pulled environment
        run: node scripts/load-vercel-env.mjs

      - name: Run KM R&D verification loop
        env:
          # Not part of the app runtime, so it stays a repo secret.
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: node scripts/km-rd-loop.mjs
