name: Test on Demand

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL for E2E tests"
        required: true
        default: "https://esg-hub.ascent.partners"
      skip_e2e:
        type: boolean
        description: "Skip Playwright E2E"
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout tool_packages
        uses: actions/checkout@v7
        with:
          repository: simonmak-ascent/tool_packages
          path: tool_packages_repo
          ref: master
          token: ${{ secrets.TOOL_PACKAGES_PAT }}

      - name: Link tool_packages
        run: ln -s "$GITHUB_WORKSPACE/tool_packages_repo" "${GITHUB_WORKSPACE}/../tool_package"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npx vitest run

  e2e:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ !inputs.skip_e2e }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout tool_packages
        uses: actions/checkout@v7
        with:
          repository: simonmak-ascent/tool_packages
          path: tool_packages_repo
          ref: master
          token: ${{ secrets.TOOL_PACKAGES_PAT }}

      - name: Link tool_packages
        run: ln -s "$GITHUB_WORKSPACE/tool_packages_repo" "${GITHUB_WORKSPACE}/../tool_package"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run E2E tests
        run: pnpm test
        env:
          BASE_URL: ${{ inputs.base_url }}
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-on-demand
          path: playwright-report/
          retention-days: 7
