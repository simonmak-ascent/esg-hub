name: KM Ingestion Pipeline

on:
  schedule:
    - cron: "17 6,18 * * *" # 06:17 and 18:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

concurrency:
  group: km-ingestion
  cancel-in-progress: false

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The production environment is a repository secret. It used to be pulled
      # from Vercel; that project no longer exists, so the secret is the source
      # of truth. Create it from the node's /etc/esg-hub/<slot>.env.
      - name: Write the production environment
        run: printf '%s' "${{ secrets.PRODUCTION_ENV }}" > .env.production.local

      - name: Run KM ingestion
        run: node scripts/km-ingestion.mjs
