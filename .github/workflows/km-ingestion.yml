name: KM Ingestion Pipeline

on:
  schedule:
    - cron: "17 6,18 * * *" # 06:17 and 18:17 UTC
  workflow_dispatch: {}

concurrency:
  group: km-ingestion
  cancel-in-progress: false

jobs:
  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run KM ingestion
        run: node scripts/km-ingestion.mjs
        env:
          SURREAL_URL: ${{ secrets.SURREAL_URL }}
          SURREAL_USERNAME: ${{ secrets.SURREAL_USERNAME }}
          SURREAL_PASSWORD: ${{ secrets.SURREAL_PASSWORD }}
          SURREAL_DATABASE: ${{ secrets.SURREAL_DATABASE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ESG_HUB_WRITE_TOKEN: ${{ secrets.ESG_HUB_WRITE_TOKEN }}
