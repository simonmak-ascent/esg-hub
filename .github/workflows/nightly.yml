name: Nightly Health Check

on:
  schedule:
    - cron: "17 18 * * *" # 18:17 UTC = ~02:17 HKT
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify database schema
        id: verify_db
        run: node scripts/verify-db-schema.mjs
        env:
          SURREAL_URL: ${{ secrets.SURREAL_URL }}
          SURREAL_USERNAME: ${{ secrets.SURREAL_USERNAME }}
          SURREAL_PASSWORD: ${{ secrets.SURREAL_PASSWORD }}
          SURREAL_DATABASE: ${{ secrets.SURREAL_DATABASE }}

      - name: Production smoke checks
        id: smoke
        run: |
          curl -sf -o /dev/null -w "GET /en -> %{http_code}\n" https://esg-hub.ascent.partners/en
          curl -sf -o /dev/null -w "GET /api/v1 -> %{http_code}\n" https://esg-hub.ascent.partners/api/v1

      - name: Broken link sweep
        id: lychee
        # Informational: outbound links may be bot-blocked (403/415/429) or
        # dead in DB content — tracked via nightly-alert issue, not a red run.
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: --max-retries 2 --timeout 20 --accept 200,202,204,301,302,307,308,403,415,429 --no-progress
            "https://esg-hub.ascent.partners/en"
            "https://esg-hub.ascent.partners/en/videos"
            "https://esg-hub.ascent.partners/en/books"
            "https://esg-hub.ascent.partners/api/v1"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open or update issue on failure
        if: failure() || steps.lychee.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M")
          if [ "${{ steps.verify_db.outcome }}" = "failure" ] || [ "${{ steps.smoke.outcome }}" = "failure" ]; then
            TYPE="HARD"
            FAILED=""
            [ "${{ steps.verify_db.outcome }}" = "failure" ] && FAILED="verify:db"
            [ "${{ steps.smoke.outcome }}" = "failure" ] && FAILED="$FAILED smoke"
            DETAILS="Failing check(s):$FAILED"
          else
            TYPE="LINKS"
            DETAILS=$(grep -E '^\* \[' lychee/out.md 2>/dev/null | head -10)
            [ -z "$DETAILS" ] && DETAILS="(no detail captured — see run log)"
          fi
          BODY=$(printf '## Nightly health check — %s failure (%s UTC)\n\n**Run:** %s\n\n### Details\n%s' "$TYPE" "$DATE" "$RUN_URL" "$DETAILS")
          EXISTING=$(gh issue list --repo ${{ github.repository }} --label nightly-alert --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh issue create --repo ${{ github.repository }} --label nightly-alert \
              --title "Nightly health check: $TYPE failure ($DATE UTC)" --body "$BODY"
          else
            gh issue comment --repo ${{ github.repository }} "$EXISTING" --body "$BODY"
          fi

      - name: Close health issue on clean run
        if: success() && steps.verify_db.outcome == 'success' && steps.smoke.outcome == 'success' && steps.lychee.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXISTING=$(gh issue list --repo ${{ github.repository }} --label nightly-alert --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment --repo ${{ github.repository }} "$EXISTING" \
              --body "✅ Resolved by clean nightly run $RUN_URL — all checks green (verify:db, smoke, link sweep: 0 errors). Closing; a new failure will reopen or recreate this issue."
            gh issue close --repo ${{ github.repository }} "$EXISTING"
          fi

  eval-pipeline:
    name: "Pipeline Evaluation"
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    env:
      SURREAL_URL: ${{ secrets.SURREAL_URL }}
      SURREAL_USERNAME: ${{ secrets.SURREAL_USERNAME }}
      SURREAL_PASSWORD: ${{ secrets.SURREAL_PASSWORD }}
      SURREAL_DATABASE: ${{ secrets.SURREAL_DATABASE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout tool_packages
        uses: actions/checkout@v7
        with:
          repository: simonplmak-cloud/tool_packages
          path: tool_packages_repo
          ref: master
          token: ${{ secrets.TOOL_PACKAGES_PAT }}

      - name: Link tool_packages
        run: ln -s "$GITHUB_WORKSPACE/tool_packages_repo" "${GITHUB_WORKSPACE}/../tool_package"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pipeline evaluation
        run: pnpm eval-pipeline
