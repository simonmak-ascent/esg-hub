name: Publish MCP

on:
  push:
    tags:
      - "mcp-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Build and publish npm package
        working-directory: mcp-server
        run: |
          npm ci
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub, simonplmak-cloud)
        run: ./mcp-publisher login github --token ${{ secrets.SIMONPLMAK_CLOUD_PAT }}

      - name: Publish to MCP Registry
        run: |
          for i in 1 2 3 4 5; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "Attempt $i failed (likely npm propagation); retrying in 30s..."
            sleep 30
          done
          exit 1
