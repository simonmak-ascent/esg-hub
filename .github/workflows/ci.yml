name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_AUTH_TOKEN: ${{ secrets.SIMONPLMAK_CLOUD_PAT }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: https://npm.pkg.github.com
          scope: '@simonplmak-cloud'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npx vitest run

      - name: Build MCP server
        run: cd mcp-server && npm ci && npx tsc

      - name: Verify committed MCP dist is current
        run: |
          if ! git diff --quiet -- mcp-server/dist; then
            echo "::error::mcp-server/dist is stale — run 'cd mcp-server && npx tsc' and commit dist"
            git --no-pager diff --stat -- mcp-server/dist
            exit 1
          fi

  eval-search:
    name: "Search Evaluation"
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    continue-on-error: true
    timeout-minutes: 15
    env:
      SURREAL_URL: ${{ secrets.SURREAL_URL }}
      SURREAL_USERNAME: ${{ secrets.SURREAL_USERNAME }}
      SURREAL_PASSWORD: ${{ secrets.SURREAL_PASSWORD }}
      SURREAL_DATABASE: ${{ secrets.SURREAL_DATABASE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: https://npm.pkg.github.com
          scope: '@simonplmak-cloud'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run search evaluation
        run: pnpm eval-search
