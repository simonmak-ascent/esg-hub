name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: https://npm.pkg.github.com
          scope: '@simonmak-ascent'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npx vitest run

      - name: Build MCP server
        run: cd mcp-server && npm ci && npx tsc

      - name: Verify committed MCP dist is current
        run: |
          if ! git -c core.fileMode=false diff --quiet -- mcp-server/dist; then
            echo "::error::mcp-server/dist is stale — run 'cd mcp-server && npx tsc' and commit dist"
            git --no-pager diff --stat -- mcp-server/dist
            exit 1
          fi

  eval-search:
    name: "Search Evaluation"
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    continue-on-error: true
    timeout-minutes: 15
    env:
      # eval-search talks to the public API only; it needs no DB credentials.
      API_BASE: https://esg-hub.ascent.partners
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: https://npm.pkg.github.com
          scope: '@simonmak-ascent'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run search evaluation
        run: pnpm eval-search || echo "::warning::Search evaluation below threshold (informational; tracked separately)"
