name: Deploy Preview to Vercel

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  NODE_AUTH_TOKEN: ${{ secrets.SIMONPLMAK_CLOUD_PAT }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: https://npm.pkg.github.com
          scope: '@simonplmak-cloud'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npx vitest run

      - name: Production build
        run: pnpm build
        env:
          SURREAL_URL: ${{ secrets.SURREAL_URL }}
          SURREAL_USERNAME: ${{ secrets.SURREAL_USERNAME }}
          SURREAL_PASSWORD: ${{ secrets.SURREAL_PASSWORD }}
          SURREAL_DATABASE: ${{ secrets.SURREAL_DATABASE }}

  deploy-preview:
    runs-on: ubuntu-latest
    needs: check
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: https://npm.pkg.github.com
          scope: '@simonplmak-cloud'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Comment PR
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Preview deployment ready!\n\nURL: ${{ steps.deploy.outputs.deploy_url }}`
            })

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run E2E tests against preview deployment
        run: pnpm test
        env:
          BASE_URL: ${{ steps.deploy.outputs.deploy_url }}
          CI: "true"

      - name: MCP contract smoke (stdio vs preview API)
        working-directory: mcp-server
        run: |
          npm ci
          npm run build
          node scripts/smoke.mjs "${{ steps.deploy.outputs.deploy_url }}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-preview
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
