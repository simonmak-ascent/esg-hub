# Deploy esg-hub to the ecs-01/02/03 HA fleet.
#
# The shared Caddy vhost (20-shared-hosts.caddy) proxies
# esg-hub.ascent.partners to 127.0.0.1:3210. This workflow builds a Next
# standalone release on each node, flips /srv/apps/esg-hub/current, restarts the
# esg-hub systemd unit and health-checks the local vhost.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-esg-hub
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, "${{ matrix.runner }}"]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: ecs-01, runner: apg-ecs-01 }
          - { node: ecs-02, runner: apg-ecs-02 }
          - { node: ecs-03, runner: apg-ecs-03 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build Next standalone
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm build

      - name: Publish release, restart and smoke
        run: |
          set -euo pipefail
          APP=/srv/apps/esg-hub
          TS="$(date -u +%Y%m%dT%H%M%S)"
          PREV="$(readlink -f "$APP/current" || true)"
          R="$APP/releases/$TS"
          mkdir -p "$R/.next"
          cp -a .next/standalone/. "$R/"
          cp -a .next/static "$R/.next/static"
          [ -d public ] && cp -a public "$R/public" || true
          # Next image optimisation writes here as the esghub service user.
          mkdir -p "$R/.next/cache"
          chmod -R a+rX "$R"
          chmod -R a+rwX "$R/.next/cache"
          ln -sfn "$R" "$APP/current"
          ls -1dt "$APP"/releases/* 2>/dev/null | tail -n +5 | xargs -r rm -rf
          sudo -n systemctl restart esg-hub
          echo "node=${{ matrix.node }} release=$R previous=${PREV:-none}"

          code=000
          for _ in $(seq 1 20); do
            code="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 -H 'Host: esg-hub.ascent.partners' https://127.0.0.1/api/health || echo 000)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          if [ "$code" != 200 ]; then
            echo "local health failed ($code); rolling back" >&2
            [ -n "$PREV" ] && ln -sfn "$PREV" "$APP/current"
            sudo -n systemctl restart esg-hub || true
            exit 1
          fi
          echo "local esg-hub/api/health -> $code"
