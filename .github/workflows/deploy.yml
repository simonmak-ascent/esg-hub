name: Deploy to Vercel

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: https://npm.pkg.github.com
          scope: '@simonmak-ascent'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npx vitest run

      # The GitHub SURREAL_* secrets are stale (signin returns InvalidAuth), while
      # the Vercel environment has the working values. Pull the same env the deploy
      # uses so the build renders pages against a reachable database.
      - name: Pull Vercel environment
        run: npx --yes vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify Database Schema
        run: |
          set -a
          . ./.vercel/.env.production.local
          set +a
          pnpm verify:db
        continue-on-error: true

      - name: Production build
        run: pnpm build

  deploy:
    runs-on: ubuntu-latest
    needs: check
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: https://npm.pkg.github.com
          scope: '@simonmak-ascent'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Do NOT pass the GitHub SURREAL_* secrets here: they are stale (signin
      # returns InvalidAuth) and process env overrides the values `vercel pull`
      # wrote to .vercel/.env.production.local, so the prerender steps fail.
      # The pulled Vercel production environment is the single source of truth.
      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to production
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run E2E tests against live deployment
        run: pnpm test
        env:
          BASE_URL: ${{ steps.deploy.outputs.deploy_url }}
          CI: "true"

      - name: MCP contract smoke (stdio vs production API)
        working-directory: mcp-server
        run: |
          npm ci
          npm run build
          node scripts/smoke.mjs "https://esg-hub.ascent.partners"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
