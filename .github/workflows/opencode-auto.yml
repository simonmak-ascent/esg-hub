name: opencode-auto
on:
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  triage:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode triage
        uses: anomalyco/opencode/github@latest
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
        with:
          model: kimi-code-plan-global/k3
          use_github_token: true
          prompt: |
            You are the engineering supervisor for this repository. The GitHub
            Copilot coding agent (@copilot) is your implementer. Load the
            copilot-supervisor skill for full orchestration rules.

            Triage this issue:
            1. If it is unclear or underspecified, comment with concise
               clarifying questions and stop.
            2. If it is a well-scoped coding task, refine the issue body if
               needed (acceptance criteria, constraints, affected files), then
               assign it to Copilot via GraphQL (REST --add-assignee copilot
               silently fails — load the copilot-supervisor skill for the exact
               commands) and comment that Copilot has been dispatched.
               IMPORTANT: GH_TOKEN is pre-configured to a user PAT with
               Copilot dispatch rights. Never override GH_TOKEN or
               GITHUB_TOKEN; run gh commands as-is.
            3. If it is a question or discussion, answer it in a comment.
            4. If it contains multiple independent tasks, split it into
               sub-issues and assign each to Copilot.
            Never implement code changes yourself — delegate to Copilot.

  review-sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode review sweep
        uses: anomalyco/opencode/github@latest
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
        with:
          model: kimi-code-plan-global/k3
          use_github_token: true
          prompt: |
            You are the engineering supervisor for this repository. Load the
            copilot-supervisor skill for full orchestration rules.
            IMPORTANT: GH_TOKEN is pre-configured to a user PAT. Never
            override GH_TOKEN or GITHUB_TOKEN; run gh commands as-is.

            Review sweep of Copilot PRs (runs on a schedule):
            1. List open PRs authored by the Copilot coding agent:
               gh pr list --state open --json number,title,author,updatedAt
               --jq '.[] | select(.author.login | test("copilot-swe-agent"))'
            2. If none, stop — do not comment anywhere.
            3. For each Copilot PR with commits you have not yet reviewed
               (check the PR comments for your previous review):
               a. Read the linked issue and the diff:
                  gh pr view <n> and gh pr diff <n>
               b. Verify against the issue's acceptance criteria. Run the
                  repo's own checks if available (discover from package.json
                  scripts / CI workflows — never invent commands).
               c. If the PR is still WIP or Copilot is mid-iteration, skip it.
               d. If changes are needed, leave ONE review comment addressed to
                  @copilot with precise numbered change requests.
               e. If the PR is ready, approve it:
                  gh pr review <n> --approve
                  and summarize why it is ready to merge.
            Never commit fixes to Copilot branches and never merge PRs —
            the human merges.